<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#313244"/>
      <stop offset="100%" stop-color="#1e1e2e"/>
    </linearGradient>
  </defs>
  <!-- background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- accent ring -->
  <circle cx="256" cy="256" r="184" fill="none" stroke="#89b4fa" stroke-width="6" opacity="0.18"/>
  <!-- character -->
  <text x="256" y="340" font-family="Noto Sans CJK TC, Noto Sans CJK SC, sans-serif"
        font-size="280" fill="#cdd6f4" text-anchor="middle" font-weight="600">寫</text>
  <!-- pen (bottom-left, nib pointing up-right toward the character) -->
  <g transform="translate(150 380) rotate(40)">
    <rect x="-20" y="-20" width="40" height="132" rx="12" fill="#cdd6f4"/>
    <rect x="-20" y="16" width="40" height="9" fill="#89b4fa"/>
    <path d="M-20 -20 L0 -62 L20 -20 Z" fill="#45475a"/>
    <path d="M0 -62 L-3.5 -74 L3.5 -74 Z" fill="#89b4fa"/>
  </g>
</svg>

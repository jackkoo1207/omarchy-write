[project]
name = "omarchy-write"
version = "0.1.0"
description = "Touchpad/mouse Chinese handwriting input for Omarchy (Hyprland/Wayland). Traditional + Simplified."
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6,<6.9",
    "onnxruntime>=1.16",
    "pillow>=10",
    "numpy>=1.24",
    "evdev>=1.6",
]

[project.scripts]
omarchy-write = "omarchy_write.app:main"
omarchy-write-toggle = "omarchy_write.toggle:main"
omarchy-write-insert = "omarchy_write.insert_signal:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["omarchy_write"]
